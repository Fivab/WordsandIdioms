name: Daily 3x IPMAT Vocab Drill

on:
  schedule:
    # 05:20 AM IST -> 23:50 UTC (previous day)
    - cron: '50 23 * * *'
    # 01:00 PM IST -> 07:30 UTC
    - cron: '30 7 * * *'
    # 09:00 PM IST -> 15:30 UTC
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Choose slot to trigger'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - afternoon
          - night

permissions:
  contents: write

jobs:
  run-vocab:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Determine Slot and Execute Drill
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ github.event.inputs.slot }}"
            python wandi.py "$SLOT" --force
          else
            # Calculate IST hour (UTC + 5.5 hours)
            UTC_MIN=$(date -u +%M)
            UTC_HR=$(date -u +%H)
            TOTAL_IST_MIN=$(( UTC_HR * 60 + UTC_MIN + 330 ))
            IST_HR=$(( (TOTAL_IST_MIN / 60) % 24 ))

            if [ "$IST_HR" -ge 4 ] && [ "$IST_HR" -le 8 ]; then
              SLOT="morning"
            elif [ "$IST_HR" -ge 12 ] && [ "$IST_HR" -le 16 ]; then
              SLOT="afternoon"
            else
              SLOT="night"
            fi

            echo "Current IST Hour: $IST_HR | Assigned Slot: $SLOT"
            python wandi.py "$SLOT"
          fi

      - name: Commit updated state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Save state for $SLOT [skip ci]" || echo "No changes to state"
          git push
